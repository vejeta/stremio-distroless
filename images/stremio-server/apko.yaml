#
# Stremio's streaming server, headless and distroless: Node.js, ffmpeg and the
# stremio-server-launcher from Wolfi Community Packages; no shell, no package
# manager, runs as nonroot. server.js (not free software) is not in the image:
# the launcher downloads it on the first start into the data volume and checks
# its sha256. Use it with web.stremio.com, TVs and phones (port 11470).
contents:
  keyring:
    - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    # kept in this repository (keys/), so builds do not depend on where it is published
    - ./keys/vejeta-wolfi.rsa.pub
  repositories:
    - https://packages.wolfi.dev/os
    - https://wolfi.vejeta.com
  packages:
    - wolfi-baselayout
    - stremio-server-launcher

accounts:
  groups:
    - groupname: nonroot
      gid: 65532
  users:
    - username: nonroot
      uid: 65532
      gid: 65532
      homedir: /home/nonroot
  run-as: 65532

paths:
  - path: /home/nonroot/.stremio-server
    type: directory
    uid: 65532
    gid: 65532
    permissions: 0o755

work-dir: /home/nonroot

environment:
  HOME: /home/nonroot
  STREMIO_SERVER_DIR: /home/nonroot/.stremio-server
  NODE_ENV: production

entrypoint:
  command: /usr/bin/node /usr/share/stremio-server-launcher/stremio-server-launcher.js

archs:
  - x86_64
  - aarch64

annotations:
  org.opencontainers.image.title: Stremio streaming server
  org.opencontainers.image.description: Stremio's streaming server on Wolfi, distroless; downloads server.js on the first start
  org.opencontainers.image.source: https://github.com/vejeta/stremio-distroless
  org.opencontainers.image.licenses: GPL-3.0-or-later
  org.opencontainers.image.vendor: vejeta
